# The whole CI of this repository: one call to the reusable pipeline, pinned to a commit.
name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    uses: docaohieu2808/reusable-workflows/.github/workflows/auto-pipeline.yml@8ba3a42948ae42fd413647765bdf124c82bb8479 # v2.0.0
